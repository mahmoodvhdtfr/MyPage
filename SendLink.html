<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .current-link {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ارسال لینک جدید</h2>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">لینک خود را وارد کنید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com" required>
            </div>
            <button type="submit">ارسال</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>لینک فعلی:</strong><br>
            <span id="currentLink">در حال بارگذاری...</span>
        </div>
    </div>

    <script>
        // نمایش لینک فعلی هنگام بارگذاری صفحه
        window.addEventListener('load', function() {
            fetch('get-link.php')
                .then(response => response.text())
                .then(link => {
                    document.getElementById('currentLink').textContent = link || 'هنوز لینکی ثبت نشده است';
                })
                .catch(error => {
                    document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
                });
        });

        // ارسال فرم
        document.getElementById('linkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const messageDiv = document.getElementById('message');
            
            // اعتبارسنجی ساده لینک
            if (!isValidUrl(link)) {
                showMessage('لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            // ارسال لینک به سرور
            fetch('save-link.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'link=' + encodeURIComponent(link)
            })
            .then(response => response.text())
            .then(result => {
                if (result === 'success') {
                    showMessage('لینک با موفقیت ذخیره شد', 'success');
                    document.getElementById('linkInput').value = '';
                    document.getElementById('currentLink').textContent = link;
                } else {
                    showMessage('خطا در ذخیره لینک', 'error');
                }
            })
            .catch(error => {
                showMessage('خطا در ارتباط با سرور', 'error');
            });
        });

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
