<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال خودکار لینک به گیت‌هاب</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
            transition: all 0.3s;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            word-break: break-all;
            border: 1px solid #dee2e6;
        }
        
        .current-link strong {
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ ارسال خودکار لینک</h2>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">🔗 لینک جدید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com/..." required>
            </div>
            <button type="submit" id="submitBtn">
                <span>💾</span>
                <span>ذخیره خودکار در گیت‌هاب</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم فعال - ذخیره مستقیم در گیت‌هاب</span>
        </div>
        
        <div class="footer">
            ⚡ لینک‌ها مستقیماً در فایل link.txt ذخیره می‌شوند
        </div>
    </div>

    <!-- فایل کانفیگ - توکن از اینجا میاد -->
    <script src="config.js"></script>
    
    <script>
        // اطلاعات مخزن
        const REPO_OWNER = 'mahmoodvhdtfr';
        const REPO_NAME = 'mahmoodvhdtfr.github.io';
        const FILE_PATH = 'link/link.txt';
        
        // تابع بارگذاری لینک فعلی
        function loadCurrentLink() {
            fetch(`/link/link.txt?t=${new Date().getTime()}`)
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    }
                    throw new Error('خطا');
                })
                .then(link => {
                    document.getElementById('currentLink').textContent = link.trim() || 'هنوز لینکی ثبت نشده';
                })
                .catch(() => {
                    document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
                });
        }

        // تابع ذخیره لینک در گیت‌هاب
        async function saveLinkToGitHub(link) {
            try {
                // ۱. دریافت SHA فایل فعلی
                const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
                const getResponse = await fetch(getUrl, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                const getData = await getResponse.json();
                const sha = getData.sha;
                
                // ۲. آپدیت فایل با لینک جدید
                const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
                const content = btoa(link); // تبدیل به base64
                
                const putBody = {
                    message: 'آپدیت خودکار لینک',
                    content: content,
                    sha: sha,
                    branch: 'main'
                };
                
                const putResponse = await fetch(putUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                });
                
                return putResponse.ok;
            } catch (error) {
                console.error('خطا در ذخیره:', error);
                return false;
            }
        }

        // رویداد ارسال فرم
        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const submitBtn = document.getElementById('submitBtn');
            
            // اعتبارسنجی لینک
            if (!link.match(/^https?:\/\/.+/)) {
                showMessage('❌ لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            showMessage('⏳ در حال ذخیره در گیت‌هاب...', 'info');
            submitBtn.disabled = true;
            
            // ذخیره لینک
            const success = await saveLinkToGitHub(link);
            
            if (success) {
                showMessage('✅ لینک با موفقیت در گیت‌هاب ذخیره شد!', 'success');
                document.getElementById('linkInput').value = '';
                setTimeout(loadCurrentLink, 1000);
            } else {
                showMessage('❌ خطا در ذخیره لینک', 'error');
            }
            
            submitBtn.disabled = false;
        });

        // تابع نمایش پیام
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            setTimeout(() => msg.className = 'message', 3000);
        }

        // بارگذاری اولیه
        window.addEventListener('load', loadCurrentLink);
        
        // به‌روزرسانی خودکار هر ۳۰ ثانیه
        setInterval(loadCurrentLink, 30000);
    </script>
</body>
</html>
