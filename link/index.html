<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            word-break: break-all;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 ارسال لینک</h2>
        <div class="subtitle">با هر بار ارسال، فایل link.txt آپدیت می‌شود</div>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">🔗 لینک جدید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com/..." required>
            </div>
            <button type="submit" id="submitBtn">
                <span>📤</span>
                <span>ارسال لینک</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم فعال</span>
        </div>
        
        <div class="footer">
            ⚡ لینک‌ها در گیت‌هاب ذخیره می‌شوند
        </div>
    </div>

    <script>
        // آدرس Web App گوگل
        const PROXY_URL = 'https://script.google.com/macros/s/AKfycbzu01s-NXo-Ew6eBtOZPWE_v4hqI2mqD2hcAeCrbv-XjEYV9oza6XjWvgBOIfqYYElDHA/exec';
        
        // تابع بارگذاری لینک فعلی
        function loadCurrentLink() {
            fetch(`/link/link.txt?t=${new Date().getTime()}`)
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    }
                    throw new Error('خطا در دریافت لینک');
                })
                .then(link => {
                    document.getElementById('currentLink').textContent = link.trim() || 'هنوز لینکی ثبت نشده';
                })
                .catch(error => {
                    document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
                    console.error(error);
                });
        }

        // تابع ارسال لینک
        document.getElementById('linkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            // اعتبارسنجی لینک
            if (!link.match(/^https?:\/\/.+/)) {
                showMessage('❌ لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            showMessage('⏳ در حال ذخیره لینک...', 'info');
            submitBtn.disabled = true;
            
            // ارسال به سرور واسط
            fetch(PROXY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ link: link })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showMessage('✅ لینک با موفقیت ذخیره شد!', 'success');
                    document.getElementById('linkInput').value = '';
                    setTimeout(loadCurrentLink, 2000);
                } else {
                    showMessage('❌ خطا: ' + (result.message || 'خطای ناشناخته'), 'error');
                }
            })
            .catch(error => {
                showMessage('❌ خطا در ارتباط با سرور', 'error');
                console.error(error);
            })
            .finally(() => {
                submitBtn.disabled = false;
            });
        });

        // تابع نمایش پیام
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }

        // بارگذاری اولیه
        window.addEventListener('load', loadCurrentLink);
        
        // به‌روزرسانی خودکار هر 30 ثانیه
        setInterval(loadCurrentLink, 30000);
    </script>
</body>
</html>
