<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک به گیت‌هاب</title>
    <style>
        /* استایل‌ها مثل قبل */
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
            display: block;
        }
        
        .error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #721c24;
            display: block;
        }
        
        .info {
            background: linear-gradient(135deg, #f6f9fc 0%, #e6f0f5 100%);
            color: #0c5460;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf2 100%);
            border-radius: 15px;
            word-break: break-all;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid #dee2e6;
            max-height: 200px;
            overflow: auto;
            display: none;
        }
        
        .debug-info pre {
            margin: 5px 0;
            white-space: pre-wrap;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 ارسال لینک به گیت‌هاب</h2>
        <div class="subtitle">با هر بار ارسال، فایل link.txt در پوشه /link آپدیت می‌شود</div>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">🔗 لینک مورد نظر را وارد کنید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com/..." required>
            </div>
            <button type="submit" id="submitBtn">
                <span>📤</span>
                <span>ارسال لینک</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم فعال - در حال بررسی...</span>
        </div>
        
        <div class="footer">
            ⚡ لینک‌ها با استفاده از GitHub Actions ذخیره می‌شوند
        </div>
        
        <div id="debugInfo" class="debug-info">
            <strong>اطلاعات خطایابی:</strong>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        // تنظیمات - این مقادیر را بررسی کنید
        const GITHUB_USERNAME = 'mahmoodvhdtfr';
        const GITHUB_REPO = 'mahmoodvhdtfr.github.io';  // نام مخزن اصلی شما
        const LINK_FILE_PATH = 'link/link.txt';  // مسیر فایل لینک (داخل پوشه link)
        
        // برای خطایابی
        function addDebug(message) {
            const debugDiv = document.getElementById('debugInfo');
            const debugContent = document.getElementById('debugContent');
            debugDiv.style.display = 'block';
            debugContent.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }

// بارگذاری لینک فعلی - خواندن مستقیم از دامنه خودتان
async function loadCurrentLink() {
    try {
        addDebug('تلاش برای دریافت لینک از دامنه خودتان...');
        // استفاده از آدرس مستقیم فایل در دامنه خودتان
        const url = `/link/link.txt?t=${new Date().getTime()}`;
        addDebug('آدرس درخواست: ' + window.location.origin + url);
        
        const response = await fetch(url);
        addDebug('وضعیت پاسخ: ' + response.status);
        
        if (response.ok) {
            const link = await response.text();
            addDebug('لینک دریافت شد: ' + link);
            document.getElementById('currentLink').textContent = link.trim() || 'هنوز لینکی ثبت نشده';
        } else {
            addDebug('خطا در دریافت فایل: ' + response.status);
            if (response.status === 404) {
                document.getElementById('currentLink').textContent = 'فایل link.txt یافت نشد (خطای 404)';
                
                // تلاش با آدرس absolute
                addDebug('تلاش مجدد با آدرس absolute...');
                const absoluteUrl = `https://mahmoodvhdtfr.ir/link/link.txt?t=${new Date().getTime()}`;
                const response2 = await fetch(absoluteUrl);
                
                if (response2.ok) {
                    const link2 = await response2.text();
                    document.getElementById('currentLink').textContent = link2.trim() || 'هنوز لینکی ثبت نشده';
                    addDebug('با آدرس absolute موفق بود: ' + link2);
                } else {
                    document.getElementById('currentLink').textContent = 'فایل link.txt یافت نشد';
                    addDebug('آدرس absolute هم کار نکرد: ' + response2.status);
                }
            } else {
                document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
            }
        }
    } catch (error) {
        addDebug('خطای شبکه: ' + error.message);
        console.error('خطا:', error);
        document.getElementById('currentLink').textContent = 'خطا در دریافت لینک: ' + error.message;
    }
}

        // ارسال فرم - ایجاد Issue
        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!isValidUrl(link)) {
                showMessage('❌ لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            showMessage('⏳ در حال ارسال لینک به گیت‌هاب...', 'info');
            submitBtn.disabled = true;
            addDebug('تلاش برای ارسال لینک: ' + link);
            
            // ایجاد Issue در گیت‌هاب
            try {
                addDebug('ارسال درخواست به API گیت‌هاب...');
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: '[LINK] لینک جدید',
                        body: link
                    })
                });

                addDebug('وضعیت پاسخ API: ' + response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    addDebug('Issue ایجاد شد: ' + data.html_url);
                    showMessage('✅ لینک با موفقیت ارسال شد! در حال آپدیت...', 'success');
                    document.getElementById('linkInput').value = '';
                    
                    // چند ثانیه صبر می‌کنیم تا اکشن اجرا بشه
                    setTimeout(async () => {
                        await loadCurrentLink();
                        showMessage('✅ لینک با موفقیت به‌روزرسانی شد!', 'success');
                    }, 5000);
                } else {
                    const error = await response.json();
                    addDebug('خطای API: ' + JSON.stringify(error));
                    console.error('خطای گیت‌هاب:', error);
                    
                    let errorMessage = 'خطا در ارسال لینک';
                    if (error.message) {
                        errorMessage += ': ' + error.message;
                    }
                    showMessage('❌ ' + errorMessage, 'error');
                }
            } catch (error) {
                addDebug('خطای شبکه: ' + error.message);
                console.error('خطا:', error);
                showMessage('❌ خطا در ارتباط با گیت‌هاب: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }

        // بارگذاری اولیه
        window.addEventListener('load', () => {
            loadCurrentLink();
            addDebug('صفحه بارگذاری شد');
            addDebug('Username: ' + GITHUB_USERNAME);
            addDebug('Repo: ' + GITHUB_REPO);
            addDebug('مسیر فایل: ' + LINK_FILE_PATH);
        });
    </script>
</body>
</html>
