<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک</title>
    <style>
        /* استایل‌ها مثل قبل */
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            word-break: break-all;
            border: 1px solid #dee2e6;
        }
        
        .current-link strong {
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 ارسال لینک به گیت‌هاب</h2>
        <div class="subtitle">بدون نیاز به توکن - همه می‌توانند استفاده کنند</div>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">🔗 لینک جدید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com/..." required>
            </div>
            <button type="submit" id="submitBtn">
                <span>📤</span>
                <span>ارسال لینک</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم امن - لینک‌ها از طریق سرور واسط ذخیره می‌شوند</span>
        </div>
        
        <div class="footer">
            ⚡ توکن شما در سمت سرور محفوظ است
        </div>
    </div>

    <script>
        // آدرس Web App گوگل (این را با آدرس خودت جایگزین کن)
        const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwf9fq_3ZTyytz-oBaLNRJeb9me_dpc_YC-dWi3L0MiReroVMo9k1yFazs6rSiPtSb0Cw/exec';
        
        // بارگذاری لینک فعلی
        async function loadCurrentLink() {
            try {
                const response = await fetch(`/link/link.txt?t=${new Date().getTime()}`);
                
                if (response.ok) {
                    const link = await response.text();
                    document.getElementById('currentLink').textContent = link.trim() || 'هنوز لینکی ثبت نشده';
                } else {
                    document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
                }
            } catch (error) {
                document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
            }
        }

        // ارسال لینک از طریق سرور واسط
        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!isValidUrl(link)) {
                showMessage('❌ لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            showMessage('⏳ در حال ذخیره لینک...', 'info');
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    mode: 'no-cors', // مهم: برای Google Apps Script
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ link: link })
                });
                
                // با no-cors نمی‌توانیم پاسخ را بخوانیم
                showMessage('✅ لینک ارسال شد! (در حال تایید...)', 'info');
                
                // چند ثانیه صبر می‌کنیم
                setTimeout(async () => {
                    await loadCurrentLink();
                    showMessage('✅ لینک با موفقیت ذخیره شد!', 'success');
                }, 3000);
                
                document.getElementById('linkInput').value = '';
                
            } catch (error) {
                showMessage('❌ خطا در ارتباط با سرور', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }

        // بارگذاری اولیه
        window.addEventListener('load', loadCurrentLink);
        setInterval(loadCurrentLink, 30000);
    </script>
</body>
</html>
