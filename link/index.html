<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک به گیت‌هاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazir', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: 700;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: 600;
            font-size: 15px;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-icon {
            position: absolute;
            right: 15px;
            color: #667eea;
            font-size: 20px;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px 20px 15px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            direction: ltr;
            text-align: left;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: linear-gradient(135deg, #f6f9fc 0%, #e6f0f5 100%);
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf2 100%);
            border-radius: 15px;
            word-break: break-all;
            border: 1px solid #d1d9e6;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .current-link strong {
            color: #333;
            display: block;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 ارسال لینک به گیت‌هاب</h2>
        <div class="subtitle">با هر بار ارسال، فایل link.txt در مخزن شما آپدیت می‌شود</div>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">لینک مورد نظر را وارد کنید:</label>
                <div class="input-group">
                    <span class="input-icon">🔗</span>
                    <input type="url" id="linkInput" placeholder="https://example.com/..." required>
                </div>
            </div>
            <button type="submit">
                <span>📤</span>
                <span>ارسال لینک</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم فعال - لینک‌ها از طریق Issues گیت‌هاب ذخیره می‌شوند</span>
        </div>
        
        <div class="footer">
            ⚡ لینک‌ها با استفاده از GitHub Actions ذخیره می‌شوند
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'mahmoodvhdtfr';
        const GITHUB_REPO = 'link';
        
        // بارگذاری لینک فعلی از فایل link.txt
        async function loadCurrentLink() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/link.txt?t=${new Date().getTime()}`);
                
                if (response.ok) {
                    const link = await response.text();
                    document.getElementById('currentLink').textContent = link.trim() || 'هنوز لینکی ثبت نشده';
                } else {
                    document.getElementById('currentLink').textContent = 'هنوز لینکی ثبت نشده';
                }
            } catch (error) {
                console.error('خطا:', error);
                document.getElementById('currentLink').textContent = 'خطا در دریافت لینک';
            }
        }

        // ارسال فرم - ایجاد Issue در گیت‌هاب
        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const link = document.getElementById('linkInput').value;
            const messageDiv = document.getElementById('message');
            
            if (!isValidUrl(link)) {
                showMessage('❌ لطفاً یک لینک معتبر وارد کنید', 'error');
                return;
            }
            
            showMessage('⏳ در حال ارسال لینک به گیت‌هاب...', 'info');
            
            // ایجاد Issue در گیت‌هاب
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: '[LINK] لینک جدید',
                        body: link
                    })
                });

                if (response.ok) {
                    showMessage('✅ لینک با موفقیت ارسال شد! در حال آپدیت...', 'success');
                    document.getElementById('linkInput').value = '';
                    
                    // چند ثانیه صبر می‌کنیم تا اکشن اجرا بشه
                    setTimeout(async () => {
                        await loadCurrentLink();
                        showMessage('✅ لینک با موفقیت به‌روزرسانی شد!', 'success');
                    }, 5000);
                } else {
                    const error = await response.json();
                    console.error('خطای گیت‌هاب:', error);
                    showMessage('❌ خطا در ارسال لینک به گیت‌هاب', 'error');
                }
            } catch (error) {
                console.error('خطا:', error);
                showMessage('❌ خطا در ارتباط با گیت‌هاب', 'error');
            }
        });

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            // اسکرول به پیام
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }

        // بارگذاری اولیه
        window.addEventListener('load', loadCurrentLink);
        
        // به‌روزرسانی خودکار هر 30 ثانیه
        setInterval(loadCurrentLink, 30000);
    </script>
</body>
</html>
