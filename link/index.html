<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال لینک | محمود وحدتی‌فر</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        #resultStatus {
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>افزودن لینک جدید</h2>
    <input type="url" id="linkInput" placeholder="https://example.com" required>
    <button id="sendBtn" onclick="sendToGithub()">ذخیره در فایل</button>
    <p id="resultStatus"></p>
</div>

<script>
async function sendToGithub() {
    const inputField = document.getElementById('linkInput');
    const statusText = document.getElementById('resultStatus');
    const btn = document.getElementById('sendBtn');
    const url = inputField.value.trim();

    if (!url) {
        alert("لطفاً یک لینک معتبر وارد کنید!");
        return;
    }

    // غیرفعال کردن دکمه هنگام ارسال
    btn.disabled = true;
    statusText.className = "";
    statusText.innerText = "⏳ در حال اتصال به سرور و گیت‌هاب...";

    try {
        const response = await fetch("https://link-saver.m-vahdatfar.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ newLink: url })
        });

        if (response.ok) {
            statusText.className = "success";
            statusText.innerText = "✅ لینک با موفقیت در link.txt ذخیره شد!";
            inputField.value = ""; 
        } else {
            const errorMsg = await response.text();
            statusText.className = "error";
            statusText.innerText = "❌ خطا: " + errorMsg;
        }
    } catch (error) {
        statusText.className = "error";
        statusText.innerText = "❌ خطای شبکه: " + error.message;
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
