<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال خودکار لینک به گیت‌هاب</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #444;
            font-weight: bold;
        }
        
        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
            transition: all 0.3s;
        }
        
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .current-link {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            word-break: break-all;
            border: 1px solid #dee2e6;
        }
        
        .current-link strong {
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        
        .link-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #667eea;
            color: #667eea;
            font-family: monospace;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50px;
            color: #667eea;
            font-size: 14px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ ارسال خودکار لینک</h2>
        
        <form id="linkForm">
            <div class="form-group">
                <label for="linkInput">🔗 لینک جدید:</label>
                <input type="url" id="linkInput" placeholder="https://example.com/..." required>
            </div>
            <button type="submit" id="submitBtn">
                <span>💾</span>
                <span>ذخیره خودکار در گیت‌هاب</span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="current-link">
            <strong>📌 آخرین لینک ذخیره شده:</strong>
            <div id="currentLink" class="link-box">در حال بارگذاری...</div>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>سیستم فعال - ذخیره مستقیم در گیت‌هاب</span>
        </div>
        
        <div class="footer">
            ⚡ لینک‌ها مستقیماً در فایل link.txt ذخیره می‌شوند
        </div>
    </div>

        
<script>
const GITHUB_TOKEN = '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';
const REPO_OWNER = 'mahmoodvhdtfr';
const REPO_NAME = 'mahmoodvhdtfr.github.io';
const FILE_PATH = 'link/link.txt';

fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
    headers: {'Authorization': `token ${GITHUB_TOKEN}`}
})
.then(r => r.json())
.then(data => console.log('SHA:', data.sha))
.catch(e => console.error('خطا:', e));
</script>
</body>
</html>
